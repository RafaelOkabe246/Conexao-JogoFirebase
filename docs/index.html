<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party game</title>

    <link rel="stylesheet" href="./menuStyle.css">
    
    <script type="module" src="./menu.js"></script>
</head>
<body>
    <main>
        <h1>Party Game</h1>
        <p>Welcome to the Party Game!</p>
        <ul>
            <li><button id="authenticateBtn" type="button">Authenticate</button></li>
            <li><button id="cleanupBtn" type="button">Clean up Lobbies</button></li>
            <li><button id="createLobbyBtn" type="button">Create Lobby</button></li>
        </ul>
        <div>
            <label for="roomCodeInput">Room Code:</label>
            <input type="text" id="roomCodeInput" placeholder="Enter room code">
            <button id="joinLobbyBtn" type="button">Join Lobby with Code</button>
        </div>
    </main>
</body>
</html>
